name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The plugin has no dependencies: the checks below are the whole gate.
      - name: Syntax
        run: |
          node --check index.js
          node --check client.js
          node --check store.js

      - name: Manifest and locale JSON
        run: |
          node -e "const p=require('./package.json'); if(!p.dsh?.bundle?.patch||!p.dsh?.client) throw new Error('manifest lost its dsh sections'); JSON.parse(require('fs').readFileSync('locale/en.json','utf8')); JSON.parse(require('fs').readFileSync('locale/zh.json','utf8')); console.log('manifest ok')"

      - name: Tests
        run: node --test test/

      - name: Pack (proves the published file list is complete)
        run: npm pack --dry-run
